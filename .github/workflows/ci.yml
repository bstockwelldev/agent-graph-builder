name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run pytest (with coverage)
        run: uv run pytest --cov=app --cov-report=term --cov-report=json:coverage.json
      - name: Coverage summary
        if: always()
        run: node ../scripts/coverage-summary.mjs backend=coverage.json >> "$GITHUB_STEP_SUMMARY"

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm comes from package.json's packageManager via Corepack; enabled
      # before setup-node so its pnpm cache can resolve the store.
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build SDK
        run: pnpm run build:sdk
      - name: Lint
        run: pnpm --filter @bstockwelldev/agent-graph-studio run lint
      - name: Typecheck
        run: pnpm --filter @bstockwelldev/agent-graph-studio run typecheck
      - name: Test (with coverage)
        run: pnpm run test:coverage
      - name: Coverage summary
        if: always()
        run: >-
          node scripts/coverage-summary.mjs
          sdk=packages/agent-graph-sdk/coverage/coverage-summary.json
          studio=apps/studio/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: pnpm run build

  sdk-package:
    # SDK 7/7 (STO-619): what npm would publish -- tests type-check, the
    # entry points' types resolve (node16 without DOM, node16 + DOM,
    # bundler), the pack has exactly the right files, bundles stay within
    # budget, and the API reference builds without warnings.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-graph-sdk
    steps:
      - uses: actions/checkout@v5
      # pnpm comes from package.json's packageManager via Corepack; enabled
      # before setup-node so its pnpm cache can resolve the store.
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Typecheck (sources and tests)
        run: pnpm run typecheck
      - name: Package checks (types, pack, size)
        run: pnpm run check
      - name: API reference
        run: pnpm run docs

  e2e:
    # Playwright end-to-end (e2e/): the built studio against a live backend
    # on the stub provider with a throwaway SQLite DB. Playwright's webServer
    # starts both (see e2e/playwright.config.ts).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # pnpm comes from package.json's packageManager via Corepack; enabled
      # before setup-node so its pnpm cache can resolve the store.
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install backend
        working-directory: backend
        run: uv sync
      - name: Install Chromium
        run: pnpm --filter @bstockwelldev/agent-graph-e2e exec playwright install --with-deps chromium
      - name: Typecheck specs
        run: pnpm --filter @bstockwelldev/agent-graph-e2e run typecheck
      - name: Run e2e (with studio client coverage)
        run: pnpm run e2e
        env:
          E2E_COVERAGE: "1"
      - name: Coverage summary
        if: always()
        run: >-
          test -f e2e/coverage/coverage-summary.json &&
          node scripts/coverage-summary.mjs "studio (e2e)"=e2e/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload e2e coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-coverage
          path: e2e/coverage/html/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
