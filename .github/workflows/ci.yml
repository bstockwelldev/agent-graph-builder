name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run pytest
        run: uv run pytest

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install, test, and build
        run: pnpm install --frozen-lockfile && pnpm test && pnpm run build

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build SDK
        run: pnpm run build:sdk
      - name: Lint
        run: pnpm --filter @bstockwelldev/agent-graph-studio run lint
      - name: Typecheck
        run: pnpm --filter @bstockwelldev/agent-graph-studio run typecheck
      - name: Test
        run: pnpm run test:studio
      - name: Build
        run: pnpm run build:studio
