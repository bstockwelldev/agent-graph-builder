name: Release SDK

# SDK 7/7 (STO-619): publishes @bstockwelldev/agent-graph-sdk to npm, tags the
# release, and attaches the typedoc site as a build artifact.
# Manual on purpose -- a publish can't be undone. Version first with
# `pnpm changeset version` (merged to master), then run this workflow.
#
# Auth is npm Trusted Publishing (OIDC): no token, no secret, no 2FA prompt.
# One-time setup, done by the package owner (needs their 2FA):
#   npm trust github @bstockwelldev/agent-graph-sdk --repo bstockwelldev/agent-graph-builder --file release-sdk.yml
# npm then accepts a publish only from this workflow file in this repository,
# and attaches provenance automatically (the repository is public).
# Requires npm >= 11.5.1 and Node >= 22.14; Node 24 ships a suitable npm.

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: release-sdk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag
      id-token: write # OIDC token npm exchanges for a publish credential
    defaults:
      run:
        working-directory: packages/agent-graph-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build, test and check the package
        run: |
          pnpm run build
          pnpm run typecheck
          pnpm run test
          pnpm run check
      - name: Skip if this version is already on npm
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@bstockwelldev/agent-graph-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@bstockwelldev/agent-graph-sdk@$VERSION is already published; nothing to do."
          fi
      - name: Publish to npm (Trusted Publishing)
        if: steps.version.outputs.published != 'true'
        run: |
          npm --version
          npm publish --access public
      - name: Tag the release
        if: steps.version.outputs.published != 'true'
        run: |
          TAG="agent-graph-sdk@${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"

  docs:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bstockwelldev/agent-graph-sdk run docs
      - uses: actions/upload-artifact@v4
        with:
          name: agent-graph-sdk-docs
          path: packages/agent-graph-sdk/docs-site
