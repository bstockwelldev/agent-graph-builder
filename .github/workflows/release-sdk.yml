name: Release SDK

# SDK 7/7 (STO-619): publishes @bstockwelldev/agent-graph-sdk to npm, tags the
# release, and attaches the typedoc site as a build artifact.
# Manual on purpose -- a publish can't be undone. Version first with
# `pnpm changeset version` (merged to master), then run this workflow.
# Needs the NPM_TOKEN repository secret: a granular token with read+write on
# the package (npm requires 2FA for publishing, so the token must be allowed
# to bypass it -- or publish from a terminal instead). No provenance: npm only
# issues it for public repositories, and this one is private. The docs job
# uploads an artifact rather than deploying to Pages, which this plan lacks.

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: release-sdk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag
    defaults:
      run:
        working-directory: packages/agent-graph-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build, test and check the package
        run: |
          pnpm run build
          pnpm run typecheck
          pnpm run test
          pnpm run check
      - name: Skip if this version is already on npm
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@bstockwelldev/agent-graph-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@bstockwelldev/agent-graph-sdk@$VERSION is already published; nothing to do."
          fi
      - name: Publish to npm
        if: steps.version.outputs.published != 'true'
        run: npm publish --access public --provenance=false
        env:
          # setup-node's npmrc reads NODE_AUTH_TOKEN; the repo's .npmrc reads NPM_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag the release
        if: steps.version.outputs.published != 'true'
        run: |
          TAG="agent-graph-sdk@${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"

  docs:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bstockwelldev/agent-graph-sdk run docs
      - uses: actions/upload-artifact@v4
        with:
          name: agent-graph-sdk-docs
          path: packages/agent-graph-sdk/docs-site
