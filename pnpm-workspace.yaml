packages:
  - "apps/*"
  - "packages/*"

# Added while apps/playground (React 18, since removed) coexisted with
# apps/studio (React 19) during the studio-consolidation program; kept as a
# guard in case two React majors land in the workspace again. lucide-react
# peer-depends only on "react", not "@types/react", so pnpm has no
# per-variant signal for its ambient JSX types and falls back to a single
# ambiguous hoisted symlink (node_modules/.pnpm/node_modules/@types/react)
# — whichever version that symlink points to "wins" for every consumer,
# breaking the others. Declaring the missing peer here lets pnpm resolve
# @types/react per lucide-react variant, matching how it already scopes
# "react" itself.
packageExtensions:
  lucide-react:
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@floating-ui/react-dom":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@xyflow/react":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@dagrejs/dagre":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  # next itself has this same gap — its bundled styled-jsx type files do a
  # bare `import ... from "react"`, and since every studio file transitively
  # touches Next's own types, an unscoped next.js poisons the *entire*
  # program's ambient React namespace, not just canvas-adjacent files.
  # Discovered when adding @xyflow/react shifted pnpm's hoist-ambiguity
  # tie-break away from 19.x and broke unrelated pages (e.g. plain Badge
  # usage) that had never touched xyflow at all.
  next:
    peerDependencies:
      "@types/react": "*"
      "@types/react-dom": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
      "@types/react-dom":
        optional: true
  react-dom:
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
