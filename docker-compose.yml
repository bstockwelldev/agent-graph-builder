services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      GRAPH_DB_PATH: /data/graphs.db
    volumes:
      - ./backend/app:/app/app
      - graph_db:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  graph_db:
  frontend_node_modules:
