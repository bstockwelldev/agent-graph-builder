services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      GRAPH_DB_PATH: /data/graphs.db
      # Same Docker-Desktop-on-Windows filesystem-watching flakiness as the
      # frontend's Vite polling fix, different failure mode: uvicorn's
      # watchfiles reloader crashed outright ("Cannot allocate memory") after
      # a couple of reload cycles instead of just missing them. Forcing
      # watchfiles' polling backend avoids the native watcher entirely.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend/app:/app/app
      - graph_db:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  studio:
    build:
      context: .
      dockerfile: apps/studio/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./apps/studio:/workspace/apps/studio
      - ./packages/agent-graph-sdk:/workspace/packages/agent-graph-sdk
      - studio_node_modules:/workspace/apps/studio/node_modules
      # Keep the image's installed SDK deps (zod etc.). Without this the
      # bind mount above exposes the host's node_modules, whose pnpm links
      # don't resolve inside the container (Windows junctions point at D:\).
      - sdk_node_modules:/workspace/packages/agent-graph-sdk/node_modules
    depends_on:
      - backend

volumes:
  graph_db:
  studio_node_modules:
  sdk_node_modules:
