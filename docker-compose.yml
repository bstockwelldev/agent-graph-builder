services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      GRAPH_DB_PATH: /data/graphs.db
      # Same Docker-Desktop-on-Windows filesystem-watching flakiness as the
      # frontend's Vite polling fix, different failure mode: uvicorn's
      # watchfiles reloader crashed outright ("Cannot allocate memory") after
      # a couple of reload cycles instead of just missing them. Forcing
      # watchfiles' polling backend avoids the native watcher entirely.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend/app:/app/app
      - graph_db:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  graph_db:
  frontend_node_modules:
